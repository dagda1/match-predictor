[project]
name = "match-predictor-api"
version = "0.1.0"
description = "FastAPI server for match predictions"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "match-predictor-ml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/match_predictor_api"]

[tool.uv.sources]
match-predictor-ml = { path = "../ml", editable = true }

[project.scripts]
serve = "match_predictor_api.main:start"
