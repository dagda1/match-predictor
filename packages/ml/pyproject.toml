[project]
name = "match-predictor-ml"
version = "0.1.0"
description = "Match prediction model using Monte Carlo simulation"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "requests>=2.32.5",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/match_predictor"]
