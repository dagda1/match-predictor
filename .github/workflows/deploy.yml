name: Deploy

on: [push]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
 
      - name: Checkout Repo
        uses: actions/checkout@v6
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Install Node dependencies
        run: pnpm install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          cd packages/deploy
          pip install -r requirements.txt

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Deploy infrastructure
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: 1
          AWS_ALARM_EMAIL: ${{ secrets.AWS_ALARM_EMAIL }}
        run: |
          rm -rf packages/deploy/cdk.out
          cp cdk.context.json packages/deploy/cdk.context.json
          cd packages/deploy
          cdk deploy --all --require-approval never

      - name: Bootstrap database
        run: |
          FN=$(aws cloudformation describe-stacks \
            --stack-name DeployStack \
            --query "Stacks[0].Outputs[?OutputKey=='BootstrapFunctionName'].OutputValue" \
            --output text)
          aws lambda invoke \
            --function-name "$FN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            /tmp/bootstrap.out
          cat /tmp/bootstrap.out
          grep -q '"status": "ok"' /tmp/bootstrap.out

      - name: Set up Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Check architecture diagram is up to date
        run: |
          pnpm arch:dia
          git diff --exit-code docs/architecture.dot

      - name: Build frontend
        run: pnpm build

      - name: Deploy frontend to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name DeployStack \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          aws s3 sync apps/frontend/dist "s3://${BUCKET}" --delete

      - name: Invalidate CloudFront index.html
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name DeployStack \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/index.html" "/"