services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: match_predictor
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
    volumes:
      - ./packages/db-bootstrap/sql/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
      - ./packages/db-bootstrap/sql/local-passwords.sql:/docker-entrypoint-initdb.d/02-local-passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d match_predictor"]
      interval: 2s
      timeout: 2s
      retries: 30
