<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Predictor — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 24px;
      transition: background-color 0.3s ease;
    }
    body.light { background: #f5f5f7; }
    body.dark  { background: #0e0e12; }
    #root { width: 100%; max-width: 720px; }
    .MuiAutocomplete-popper { z-index: 1300 !important; }
  </style>
</head>
<body class="dark">
  <div id="root"></div>

  <script type="text/babel">
    const {
      ThemeProvider, createTheme,
      CssBaseline, Paper, Typography, Button, Box, Stack,
      Autocomplete, TextField, LinearProgress, Table, TableBody,
      TableCell, TableContainer, TableHead, TableRow, Chip,
      Fade, Grow, IconButton, Tooltip
    } = MaterialUI;

    /* ── Themes ────────────────────────────────────────────── */
    const makeTheme = (mode) => createTheme({
      palette: {
        mode,
        primary:   { main: mode === 'dark' ? '#7C4DFF' : '#3D195B' },
        secondary: { main: '#00FF87' },
        background: mode === 'dark'
          ? { default: '#0e0e12', paper: '#1a1a24' }
          : { default: '#f5f5f7', paper: '#ffffff' },
        text: mode === 'dark'
          ? { primary: '#e8e8ed', secondary: '#8888a0' }
          : { primary: '#1a1a2e', secondary: '#666680' },
      },
      typography: {
        fontFamily: "'Roboto', sans-serif",
        h5: { fontWeight: 700, letterSpacing: '-0.02em' },
        subtitle2: {
          fontWeight: 500,
          fontSize: '0.82rem',
          letterSpacing: '0.04em',
          textTransform: 'uppercase',
          color: mode === 'dark' ? '#6a6a80' : '#888',
        },
      },
      shape: { borderRadius: 14 },
      components: {
        MuiButton: {
          styleOverrides: {
            root: { borderRadius: 12, textTransform: 'none', fontWeight: 600, fontSize: '0.95rem', padding: '10px 32px' },
          },
        },
        MuiPaper: {
          styleOverrides: {
            root: {
              borderRadius: 16,
              backgroundImage: 'none',
              boxShadow: mode === 'dark'
                ? '0 1px 3px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4)'
                : '0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06)',
              border: mode === 'dark' ? '1px solid rgba(255,255,255,0.06)' : 'none',
            },
          },
        },
        MuiOutlinedInput: {
          styleOverrides: {
            root: mode === 'dark' ? {
              '& .MuiOutlinedInput-notchedOutline': { borderColor: 'rgba(255,255,255,0.12)' },
              '&:hover .MuiOutlinedInput-notchedOutline': { borderColor: 'rgba(255,255,255,0.24)' },
            } : {},
          },
        },
        MuiTableCell: {
          styleOverrides: {
            root: mode === 'dark' ? { borderBottomColor: 'rgba(255,255,255,0.06)' } : {},
          },
        },
      },
    });

    /* ── Data ───────────────────────────────────────────────── */
    const TEAMS = [
      'Arsenal', 'Aston Villa', 'Bournemouth', 'Brentford', 'Brighton',
      'Burnley', 'Chelsea', 'Crystal Palace', 'Everton', 'Fulham',
      'Leeds United', 'Leicester City', 'Liverpool', 'Manchester City',
      'Manchester United', 'Newcastle United', 'Nottingham Forest',
      'Sunderland', 'Tottenham Hotspur', 'West Ham United',
    ];

    const MOCK_RESULT = {
      home_win: 0.482,
      draw: 0.241,
      away_win: 0.277,
      scorelines: [
        { home: 2, away: 1, prob: 0.142 },
        { home: 1, away: 0, prob: 0.128 },
        { home: 2, away: 0, prob: 0.112 },
        { home: 1, away: 1, prob: 0.098 },
        { home: 3, away: 1, prob: 0.074 },
        { home: 0, away: 0, prob: 0.068 },
        { home: 0, away: 1, prob: 0.062 },
        { home: 2, away: 2, prob: 0.054 },
        { home: 3, away: 2, prob: 0.041 },
        { home: 1, away: 2, prob: 0.038 },
      ],
    };

    /* ── Helpers ────────────────────────────────────────────── */
    const pct  = (v) => `${(v * 100).toFixed(1)}%`;
    const lerp = (a, b, t) => a + (b - a) * t;
    const fmt  = (n) => n.toLocaleString();

    /* ── SVG Icons (no extra dep) ──────────────────────────── */
    const SunIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    );
    const MoonIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    );

    /* ── Components ────────────────────────────────────────── */

    function TeamPicker({ label, value, onChange, exclude }) {
      const options = TEAMS.filter((t) => t !== exclude);
      return (
        <Autocomplete
          value={value}
          onChange={(_, v) => onChange(v)}
          options={options}
          renderInput={(params) => <TextField {...params} label={label} variant="outlined" />}
          disableClearable={false}
          fullWidth
          sx={{ minWidth: 240 }}
        />
      );
    }

    function ProbBar({ label, value, color, animatedValue, isDark }) {
      const display = animatedValue != null ? animatedValue : value;
      const trackBg = isDark ? 'rgba(255,255,255,0.06)' : '#eee';
      const labelColor = isDark ? '#b0b0c0' : '#444';
      return (
        <Box sx={{ mb: 1.5 }}>
          <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mb: 0.5 }}>
            <Typography variant="body2" sx={{ fontWeight: 500, color: labelColor }}>{label}</Typography>
            <Typography variant="body2" sx={{ fontWeight: 700, fontFeatureSettings: "'tnum'", color }}>{pct(display)}</Typography>
          </Stack>
          <Box sx={{ width: '100%', height: 10, borderRadius: 5, bgcolor: trackBg, overflow: 'hidden' }}>
            <Box sx={{
              width: `${display * 100}%`,
              height: '100%',
              borderRadius: 5,
              bgcolor: color,
              transition: animatedValue != null ? 'none' : 'width 0.6s ease',
            }} />
          </Box>
        </Box>
      );
    }

    function SimCounter({ count, total, isDark }) {
      return (
        <Typography variant="body2" sx={{ textAlign: 'center', color: isDark ? '#6a6a80' : '#888', fontFeatureSettings: "'tnum'", mt: 0.5, mb: 2 }}>
          {fmt(count)} / {fmt(total)} matches simulated
        </Typography>
      );
    }

    function ScorelineTable({ scorelines, revealed, isDark }) {
      const rows = revealed != null ? scorelines.slice(0, revealed) : scorelines;
      const headColor = isDark ? '#5a5a70' : '#999';
      return (
        <TableContainer>
          <Table size="small">
            <TableHead>
              <TableRow>
                {['#', 'Score', ''].map((h, i) => (
                  <TableCell key={h} align={i === 2 ? 'right' : 'left'}
                    sx={{ fontWeight: 700, color: headColor, fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.06em' }}>
                    {h || 'Probability'}
                  </TableCell>
                ))}
              </TableRow>
            </TableHead>
            <TableBody>
              {rows.map((s, i) => (
                <Grow in key={i} timeout={300 + i * 80}>
                  <TableRow sx={{ '&:last-child td': { borderBottom: 0 } }}>
                    <TableCell sx={{ fontWeight: 500, color: isDark ? '#5a5a70' : '#aaa', width: 32 }}>{i + 1}</TableCell>
                    <TableCell>
                      <Typography variant="body2" sx={{ fontWeight: 600, fontFeatureSettings: "'tnum'" }}>
                        {s.home} – {s.away}
                      </Typography>
                    </TableCell>
                    <TableCell align="right">
                      <Chip
                        label={pct(s.prob)}
                        size="small"
                        sx={{
                          fontWeight: 600,
                          fontFeatureSettings: "'tnum'",
                          fontSize: '0.78rem',
                          ...(isDark ? {
                            bgcolor: i === 0 ? '#7C4DFF' : i < 3 ? 'rgba(124,77,255,0.15)' : 'rgba(255,255,255,0.05)',
                            color: i === 0 ? '#fff' : i < 3 ? '#b09aff' : '#8888a0',
                          } : {
                            bgcolor: i === 0 ? '#3D195B' : i < 3 ? '#ede7f6' : '#f5f5f5',
                            color: i === 0 ? '#fff' : i < 3 ? '#3D195B' : '#666',
                          }),
                        }}
                      />
                    </TableCell>
                  </TableRow>
                </Grow>
              ))}
            </TableBody>
          </Table>
        </TableContainer>
      );
    }

    /* ── Main App ──────────────────────────────────────────── */
    function App() {
      const [mode, setMode]       = React.useState('dark');
      const [home, setHome]       = React.useState(null);
      const [away, setAway]       = React.useState(null);
      const [phase, setPhase]     = React.useState('empty');
      const [simProgress, setSimProgress] = React.useState(0);
      const [animProbs, setAnimProbs]     = React.useState({ h: 0.333, d: 0.333, a: 0.333 });
      const [revealedRows, setRevealedRows] = React.useState(0);
      const rafRef = React.useRef(null);

      const isDark = mode === 'dark';
      const theme  = React.useMemo(() => makeTheme(mode), [mode]);

      const toggleMode = () => {
        const next = isDark ? 'light' : 'dark';
        setMode(next);
        document.body.className = next;
      };

      React.useEffect(() => {
        if (home && away && phase === 'empty') setPhase('ready');
        if ((!home || !away) && phase === 'ready') setPhase('empty');
      }, [home, away]);

      const runSimulation = () => {
        setPhase('simulating');
        setSimProgress(0);
        setRevealedRows(0);
        setAnimProbs({ h: 0.333, d: 0.333, a: 0.333 });

        const duration = 2600;
        const start = performance.now();
        const target = MOCK_RESULT;

        const tick = (now) => {
          const elapsed = now - start;
          const t = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          const jitter = (1 - ease) * (Math.random() - 0.5) * 0.08;

          setSimProgress(ease);
          setAnimProbs({
            h: lerp(0.333, target.home_win, ease) + jitter,
            d: lerp(0.333, target.draw,     ease) - jitter * 0.5,
            a: lerp(0.333, target.away_win, ease) - jitter * 0.5,
          });
          setRevealedRows(Math.min(10, Math.floor(ease * 13)));

          if (t < 1) {
            rafRef.current = requestAnimationFrame(tick);
          } else {
            setAnimProbs({ h: target.home_win, d: target.draw, a: target.away_win });
            setRevealedRows(10);
            setTimeout(() => setPhase('result'), 200);
          }
        };

        rafRef.current = requestAnimationFrame(tick);
      };

      React.useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

      const reset = () => {
        setPhase(home && away ? 'ready' : 'empty');
        setSimProgress(0);
        setRevealedRows(0);
      };

      const isSimulating = phase === 'simulating';
      const showResult   = phase === 'result' || isSimulating;

      /* colour tokens */
      const homeWinColor = isDark ? '#7C4DFF' : '#3D195B';
      const drawColor    = isDark ? '#546E7A' : '#78909C';
      const awayWinColor = '#00E676';
      const vsColor      = isDark ? '#555' : '#bbb';
      const subColor     = isDark ? '#6a6a80' : '#999';
      const gradBtn      = isDark
        ? 'linear-gradient(135deg, #5B2D8E 0%, #7C4DFF 100%)'
        : 'linear-gradient(135deg, #3D195B 0%, #5B2D8E 100%)';
      const gradBtnHover = isDark
        ? 'linear-gradient(135deg, #4A2375 0%, #6A3DE0 100%)'
        : 'linear-gradient(135deg, #2E1245 0%, #4A2375 100%)';
      const progressTrack = isDark ? 'rgba(255,255,255,0.06)' : '#eee';
      const progressGrad  = isDark
        ? 'linear-gradient(90deg, #7C4DFF 0%, #00FF87 100%)'
        : 'linear-gradient(90deg, #3D195B 0%, #00FF87 100%)';

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <Stack spacing={3}>
            {/* ── Header card ───────────────────────── */}
            <Paper sx={{ p: { xs: 3, sm: 4 } }}>
              <Stack direction="row" justifyContent="space-between" alignItems="flex-start">
                <Box>
                  <Typography variant="h5" sx={{ mb: 0.5 }}>Match Predictor</Typography>
                  <Typography variant="subtitle2" sx={{ mb: 3 }}>Monte Carlo · 10,000 simulations</Typography>
                </Box>
                <Tooltip title={isDark ? 'Light mode' : 'Dark mode'}>
                  <IconButton onClick={toggleMode} sx={{ color: isDark ? '#aaa' : '#666', mt: -0.5 }}>
                    {isDark ? <SunIcon /> : <MoonIcon />}
                  </IconButton>
                </Tooltip>
              </Stack>

              <Stack direction={{ xs: 'column', sm: 'row' }} spacing={2} sx={{ mb: 3 }}>
                <TeamPicker label="Home team" value={home} onChange={setHome} exclude={away} />
                <TeamPicker label="Away team" value={away} onChange={setAway} exclude={home} />
              </Stack>

              {phase !== 'result' && (
                <Button
                  variant="contained"
                  fullWidth
                  disabled={phase === 'empty' || isSimulating}
                  onClick={runSimulation}
                  disableElevation
                  sx={{
                    py: 1.4,
                    fontSize: '1rem',
                    background: phase === 'empty' ? undefined : gradBtn,
                    '&:hover': { background: gradBtnHover },
                  }}
                >
                  {isSimulating ? 'Simulating…' : 'Predict'}
                </Button>
              )}

              {phase === 'result' && (
                <Button variant="outlined" fullWidth onClick={reset} sx={{ py: 1.2 }}>
                  New prediction
                </Button>
              )}
            </Paper>

            {/* ── Probabilities ──────────────────────── */}
            {showResult && (
              <Fade in>
                <Paper sx={{ p: { xs: 3, sm: 4 } }}>
                  {isSimulating && (
                    <Box sx={{ mb: 2 }}>
                      <LinearProgress
                        variant="determinate"
                        value={simProgress * 100}
                        sx={{
                          height: 8,
                          borderRadius: 4,
                          bgcolor: progressTrack,
                          '& .MuiLinearProgress-bar': { borderRadius: 4, background: progressGrad },
                        }}
                      />
                      <SimCounter count={Math.round(simProgress * 10000)} total={10000} isDark={isDark} />
                    </Box>
                  )}

                  {phase === 'result' && (
                    <Box sx={{ textAlign: 'center', mb: 3 }}>
                      <Typography variant="body2" sx={{ color: subColor, fontWeight: 500, mb: 0.5 }}>Prediction</Typography>
                      <Typography variant="h5" sx={{ fontSize: '1.35rem' }}>
                        {home} <span style={{ color: vsColor, fontWeight: 400, margin: '0 6px' }}>vs</span> {away}
                      </Typography>
                    </Box>
                  )}

                  <Typography variant="subtitle2" sx={{ mb: 2 }}>
                    {isSimulating ? 'Converging…' : 'Outcome probabilities'}
                  </Typography>

                  <Box sx={{ mb: 1 }}>
                    <ProbBar label={`${home || 'Home'} win`} value={MOCK_RESULT.home_win} animatedValue={isSimulating ? animProbs.h : null} color={homeWinColor} isDark={isDark} />
                    <ProbBar label="Draw" value={MOCK_RESULT.draw} animatedValue={isSimulating ? animProbs.d : null} color={drawColor} isDark={isDark} />
                    <ProbBar label={`${away || 'Away'} win`} value={MOCK_RESULT.away_win} animatedValue={isSimulating ? animProbs.a : null} color={awayWinColor} isDark={isDark} />
                  </Box>
                </Paper>
              </Fade>
            )}

            {/* ── Scorelines ────────────────────────── */}
            {showResult && (
              <Fade in timeout={400}>
                <Paper sx={{ p: { xs: 3, sm: 4 } }}>
                  <Typography variant="subtitle2" sx={{ mb: 2 }}>Most likely scorelines</Typography>
                  <ScorelineTable scorelines={MOCK_RESULT.scorelines} revealed={isSimulating ? revealedRows : null} isDark={isDark} />
                </Paper>
              </Fade>
            )}
          </Stack>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
