<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Match Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      transition: background-color 0.3s ease;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    body.light { background: #f5f5f7; }
    body.dark  { background: #0e0e12; }
    .MuiAutocomplete-popper { z-index: 1300 !important; }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="dark">
  <div id="root"></div>

  <script type="text/babel">
    const {
      ThemeProvider, createTheme, useMediaQuery,
      CssBaseline, AppBar, Toolbar, Paper, Typography, Button, Box, Stack,
      Autocomplete, TextField, LinearProgress, Table, TableBody,
      TableCell, TableContainer, TableHead, TableRow, Chip,
      Fade, Grow, IconButton, Tooltip, Divider, Container
    } = MaterialUI;

    /* ── Themes ────────────────────────────────────────────── */
    const makeTheme = (mode) => createTheme({
      palette: {
        mode,
        primary:   { main: mode === 'dark' ? '#7C4DFF' : '#3D195B' },
        secondary: { main: '#00FF87' },
        background: mode === 'dark'
          ? { default: '#0e0e12', paper: '#1a1a24' }
          : { default: '#f5f5f7', paper: '#ffffff' },
        text: mode === 'dark'
          ? { primary: '#e8e8ed', secondary: '#8888a0' }
          : { primary: '#1a1a2e', secondary: '#666680' },
      },
      typography: {
        fontFamily: "'Roboto', sans-serif",
        h5: { fontWeight: 700, letterSpacing: '-0.02em' },
        subtitle2: {
          fontWeight: 500, fontSize: '0.82rem', letterSpacing: '0.04em',
          textTransform: 'uppercase', color: mode === 'dark' ? '#6a6a80' : '#888',
        },
      },
      shape: { borderRadius: 14 },
      components: {
        MuiButton: { styleOverrides: { root: { borderRadius: 12, textTransform: 'none', fontWeight: 600, fontSize: '0.95rem', padding: '10px 32px' } } },
        MuiPaper: { styleOverrides: { root: {
          borderRadius: 16, backgroundImage: 'none',
          boxShadow: mode === 'dark' ? '0 1px 3px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4)' : '0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06)',
          border: mode === 'dark' ? '1px solid rgba(255,255,255,0.06)' : 'none',
        } } },
        MuiOutlinedInput: { styleOverrides: { root: {
          ...(mode === 'dark' ? { '& .MuiOutlinedInput-notchedOutline': { borderColor: 'rgba(255,255,255,0.12)' }, '&:hover .MuiOutlinedInput-notchedOutline': { borderColor: 'rgba(255,255,255,0.24)' } } : {}),
        } } },
        MuiTableCell: { styleOverrides: { root: { padding: '10px 12px', ...(mode === 'dark' ? { borderBottomColor: 'rgba(255,255,255,0.06)' } : {}) } } },
      },
    });

    /* ── Data ───────────────────────────────────────────────── */
    const TEAMS = [
      'Arsenal', 'Aston Villa', 'Bournemouth', 'Brentford', 'Brighton',
      'Burnley', 'Chelsea', 'Crystal Palace', 'Everton', 'Fulham',
      'Leeds United', 'Leicester City', 'Liverpool', 'Manchester City',
      'Manchester United', 'Newcastle United', 'Nottingham Forest',
      'Sunderland', 'Tottenham Hotspur', 'West Ham United',
    ];

    const MOCK_RESPONSE = {
      ml: {
        homeWin: 0.482, draw: 0.241, awayWin: 0.277,
        scorelines: [
          { homeGoals: 2, awayGoals: 1, probability: 0.142 },
          { homeGoals: 1, awayGoals: 0, probability: 0.128 },
          { homeGoals: 2, awayGoals: 0, probability: 0.112 },
          { homeGoals: 1, awayGoals: 1, probability: 0.098 },
          { homeGoals: 3, awayGoals: 1, probability: 0.074 },
          { homeGoals: 0, awayGoals: 0, probability: 0.068 },
          { homeGoals: 0, awayGoals: 1, probability: 0.062 },
          { homeGoals: 2, awayGoals: 2, probability: 0.054 },
          { homeGoals: 3, awayGoals: 2, probability: 0.041 },
          { homeGoals: 1, awayGoals: 2, probability: 0.038 },
        ],
      },
      poisson: {
        homeWin: 0.438, draw: 0.263, awayWin: 0.299, homeLambda: 1.72, awayLambda: 1.31,
        scorelines: [
          { homeGoals: 1, awayGoals: 1, probability: 0.134 },
          { homeGoals: 2, awayGoals: 1, probability: 0.115 },
          { homeGoals: 1, awayGoals: 0, probability: 0.102 },
          { homeGoals: 2, awayGoals: 0, probability: 0.088 },
          { homeGoals: 0, awayGoals: 1, probability: 0.078 },
          { homeGoals: 0, awayGoals: 0, probability: 0.076 },
          { homeGoals: 2, awayGoals: 2, probability: 0.075 },
          { homeGoals: 3, awayGoals: 1, probability: 0.066 },
          { homeGoals: 1, awayGoals: 2, probability: 0.059 },
          { homeGoals: 3, awayGoals: 2, probability: 0.043 },
        ],
      },
    };

    const MOCK_MATCHWEEKS = [
      { week: '23', startDate: '25 Jan', endDate: '27 Jan 2026', matchCount: 10 },
      { week: '24', startDate: '1 Feb', endDate: '3 Feb 2026', matchCount: 10 },
      { week: '25', startDate: '8 Feb', endDate: '10 Feb 2026', matchCount: 10 },
    ];

    const MOCK_MATCHWEEK_DATA = {
      week: '24', startDate: '1 Feb', endDate: '3 Feb 2026',
      summary: { mlCorrect: 5, mlTotal: 10, poissonCorrect: 4, poissonTotal: 10 },
      matches: [
        { homeTeam: 'Liverpool', awayTeam: 'Man City', homeGoals: 2, awayGoals: 1, actual: 'home',
          ml: { homeWin: 0.482, draw: 0.241, awayWin: 0.277, pred: 'home', correct: true, topScore: { h: 2, a: 1, prob: 0.142 } },
          poisson: { homeWin: 0.312, draw: 0.263, awayWin: 0.425, pred: 'away', correct: false, homeLambda: 1.72, awayLambda: 1.31, topScore: { h: 1, a: 1, prob: 0.134 } } },
        { homeTeam: 'Arsenal', awayTeam: 'Aston Villa', homeGoals: 1, awayGoals: 0, actual: 'home',
          ml: { homeWin: 0.551, draw: 0.224, awayWin: 0.225, pred: 'home', correct: true, topScore: { h: 1, a: 0, prob: 0.158 } },
          poisson: { homeWin: 0.438, draw: 0.281, awayWin: 0.281, pred: 'home', correct: true, homeLambda: 1.85, awayLambda: 0.94, topScore: { h: 2, a: 1, prob: 0.118 } } },
        { homeTeam: 'Chelsea', awayTeam: 'Tottenham', homeGoals: 1, awayGoals: 1, actual: 'draw',
          ml: { homeWin: 0.423, draw: 0.241, awayWin: 0.336, pred: 'home', correct: false, topScore: { h: 2, a: 1, prob: 0.112 } },
          poisson: { homeWin: 0.352, draw: 0.295, awayWin: 0.353, pred: 'away', correct: false, homeLambda: 1.45, awayLambda: 1.38, topScore: { h: 1, a: 1, prob: 0.128 } } },
        { homeTeam: 'Newcastle', awayTeam: 'Everton', homeGoals: 3, awayGoals: 0, actual: 'home',
          ml: { homeWin: 0.612, draw: 0.198, awayWin: 0.190, pred: 'home', correct: true, topScore: { h: 2, a: 0, prob: 0.145 } },
          poisson: { homeWin: 0.521, draw: 0.268, awayWin: 0.211, pred: 'home', correct: true, homeLambda: 1.92, awayLambda: 0.78, topScore: { h: 2, a: 0, prob: 0.131 } } },
        { homeTeam: 'Brighton', awayTeam: 'Fulham', homeGoals: 0, awayGoals: 2, actual: 'away',
          ml: { homeWin: 0.390, draw: 0.282, awayWin: 0.328, pred: 'home', correct: false, topScore: { h: 1, a: 0, prob: 0.108 } },
          poisson: { homeWin: 0.355, draw: 0.291, awayWin: 0.354, pred: 'home', correct: false, homeLambda: 1.35, awayLambda: 1.22, topScore: { h: 1, a: 1, prob: 0.121 } } },
        { homeTeam: 'Brentford', awayTeam: 'Bournemouth', homeGoals: 2, awayGoals: 2, actual: 'draw',
          ml: { homeWin: 0.410, draw: 0.195, awayWin: 0.395, pred: 'home', correct: false, topScore: { h: 2, a: 1, prob: 0.105 } },
          poisson: { homeWin: 0.362, draw: 0.271, awayWin: 0.367, pred: 'away', correct: false, homeLambda: 1.41, awayLambda: 1.38, topScore: { h: 1, a: 1, prob: 0.119 } } },
        { homeTeam: 'Crystal Palace', awayTeam: 'Burnley', homeGoals: 1, awayGoals: 0, actual: 'home',
          ml: { homeWin: 0.558, draw: 0.238, awayWin: 0.204, pred: 'home', correct: true, topScore: { h: 1, a: 0, prob: 0.152 } },
          poisson: { homeWin: 0.462, draw: 0.284, awayWin: 0.254, pred: 'home', correct: true, homeLambda: 1.55, awayLambda: 0.88, topScore: { h: 1, a: 0, prob: 0.138 } } },
        { homeTeam: 'Nott. Forest', awayTeam: 'Leicester', homeGoals: 2, awayGoals: 1, actual: 'home',
          ml: { homeWin: 0.475, draw: 0.261, awayWin: 0.264, pred: 'home', correct: true, topScore: { h: 1, a: 0, prob: 0.118 } },
          poisson: { homeWin: 0.342, draw: 0.288, awayWin: 0.370, pred: 'away', correct: false, homeLambda: 1.28, awayLambda: 1.35, topScore: { h: 1, a: 1, prob: 0.125 } } },
        { homeTeam: 'Sunderland', awayTeam: 'West Ham', homeGoals: 0, awayGoals: 1, actual: 'away',
          ml: { homeWin: 0.316, draw: 0.342, awayWin: 0.342, pred: 'draw', correct: false, topScore: { h: 1, a: 1, prob: 0.115 } },
          poisson: { homeWin: 0.298, draw: 0.324, awayWin: 0.378, pred: 'away', correct: true, homeLambda: 1.05, awayLambda: 1.28, topScore: { h: 0, a: 1, prob: 0.132 } } },
        { homeTeam: 'Man United', awayTeam: 'Leeds', homeGoals: 0, awayGoals: 0, actual: 'draw',
          ml: { homeWin: 0.445, draw: 0.218, awayWin: 0.337, pred: 'home', correct: false, topScore: { h: 2, a: 1, prob: 0.098 } },
          poisson: { homeWin: 0.392, draw: 0.277, awayWin: 0.331, pred: 'home', correct: false, homeLambda: 1.48, awayLambda: 1.15, topScore: { h: 1, a: 0, prob: 0.112 } } },
      ],
    };

    /* ── Helpers ────────────────────────────────────────────── */
    const pct  = (v) => `${(v * 100).toFixed(1)}%`;
    const lerp = (a, b, t) => a + (b - a) * t;
    const fmt  = (n) => n.toLocaleString();

    /* ── SVG Icons ─────────────────────────────────────────── */
    const SunIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    );
    const MoonIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    );
    const ChevronLeft = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    );
    const ChevronRight = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    );

    /* ── TopNav ────────────────────────────────────────────── */
    function TopNav({ page, setPage, isDark, toggleMode, isMobile }) {
      const navBtn = (label, target) => (
        <Button
          size="small"
          onClick={() => setPage(target)}
          sx={{
            color: page === target ? (isDark ? '#e8e8ed' : '#1a1a2e') : (isDark ? '#6a6a80' : '#999'),
            fontWeight: page === target ? 700 : 500,
            fontSize: { xs: '0.82rem', sm: '0.88rem' },
            minWidth: 0,
            px: 1.5,
            borderRadius: 2,
            bgcolor: page === target ? (isDark ? 'rgba(124,77,255,0.12)' : 'rgba(61,25,91,0.08)') : 'transparent',
            '&:hover': { bgcolor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.04)' },
          }}
        >
          {label}
        </Button>
      );

      return (
        <AppBar
          position="sticky"
          elevation={0}
          sx={{
            bgcolor: isDark ? 'rgba(14,14,18,0.85)' : 'rgba(245,245,247,0.85)',
            backdropFilter: 'blur(12px)',
            borderBottom: `1px solid ${isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)'}`,
          }}
        >
          <Toolbar variant="dense" sx={{ minHeight: { xs: 48, sm: 52 }, px: { xs: 1.5, sm: 3 } }}>
            <Typography variant="h6" sx={{ fontWeight: 700, fontSize: { xs: '0.95rem', sm: '1.05rem' }, color: isDark ? '#e8e8ed' : '#1a1a2e', mr: 2 }}>
              xG Predictor
            </Typography>
            <Stack direction="row" spacing={0.5}>
              {navBtn('Predictor', 'predictor')}
              {navBtn('Results', 'results')}
            </Stack>
            <Box sx={{ flexGrow: 1 }} />
            <Tooltip title={isDark ? 'Light mode' : 'Dark mode'}>
              <IconButton onClick={toggleMode} size="small" sx={{ color: isDark ? '#8888a0' : '#666' }}>
                {isDark ? <SunIcon /> : <MoonIcon />}
              </IconButton>
            </Tooltip>
          </Toolbar>
        </AppBar>
      );
    }

    /* ── Shared components ─────────────────────────────────── */

    function TeamPicker({ label, value, onChange, exclude }) {
      return (
        <Autocomplete
          value={value} onChange={(_, v) => onChange(v)}
          options={TEAMS.filter((t) => t !== exclude)} freeSolo={false}
          renderInput={(params) => <TextField {...params} label={label} variant="outlined" InputLabelProps={{ ...params.InputLabelProps, style: { fontSize: 14 } }} />}
          disableClearable={false} fullWidth
        />
      );
    }

    function ProbBar({ label, value, color, animatedValue, isDark, compact }) {
      const display = animatedValue != null ? animatedValue : value;
      const trackBg = isDark ? 'rgba(255,255,255,0.06)' : '#eee';
      return (
        <Box sx={{ mb: compact ? 1 : 1.5 }}>
          <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mb: 0.4 }}>
            <Typography variant="body2" noWrap sx={{ fontWeight: 500, color: isDark ? '#b0b0c0' : '#444', fontSize: compact ? '0.78rem' : '0.875rem', maxWidth: '60%' }}>{label}</Typography>
            <Typography variant="body2" sx={{ fontWeight: 700, fontFeatureSettings: "'tnum'", color, fontSize: compact ? '0.78rem' : '0.875rem' }}>{pct(display)}</Typography>
          </Stack>
          <Box sx={{ width: '100%', height: compact ? 8 : 10, borderRadius: 5, bgcolor: trackBg, overflow: 'hidden' }}>
            <Box sx={{ width: `${display * 100}%`, height: '100%', borderRadius: 5, bgcolor: color, transition: animatedValue != null ? 'none' : 'width 0.6s ease' }} />
          </Box>
        </Box>
      );
    }

    function SimCounter({ count, total, isDark }) {
      return (
        <Typography variant="body2" sx={{ textAlign: 'center', color: isDark ? '#6a6a80' : '#888', fontFeatureSettings: "'tnum'", mt: 0.5, mb: 1.5, fontSize: '0.8rem' }}>
          {fmt(count)} / {fmt(total)} simulated
        </Typography>
      );
    }

    function ScorelineTable({ scorelines, revealed, isDark, chipColor, chipBg, chipAccentBg }) {
      const rows = revealed != null ? scorelines.slice(0, revealed) : scorelines;
      const headColor = isDark ? '#5a5a70' : '#999';
      return (
        <TableContainer sx={{ mx: { xs: -1, sm: 0 } }}>
          <Table size="small">
            <TableHead>
              <TableRow>
                <TableCell sx={{ fontWeight: 700, color: headColor, fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.06em', width: 28, pl: { xs: 1.5, sm: 2 } }}>#</TableCell>
                <TableCell sx={{ fontWeight: 700, color: headColor, fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.06em' }}>Score</TableCell>
                <TableCell align="right" sx={{ fontWeight: 700, color: headColor, fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.06em', pr: { xs: 1.5, sm: 2 } }}>Prob</TableCell>
              </TableRow>
            </TableHead>
            <TableBody>
              {rows.map((s, i) => (
                <Grow in key={i} timeout={300 + i * 80}>
                  <TableRow sx={{ '&:last-child td': { borderBottom: 0 } }}>
                    <TableCell sx={{ fontWeight: 500, color: isDark ? '#5a5a70' : '#aaa', width: 28, pl: { xs: 1.5, sm: 2 } }}>{i + 1}</TableCell>
                    <TableCell><Typography variant="body2" sx={{ fontWeight: 600, fontFeatureSettings: "'tnum'", fontSize: '0.85rem' }}>{s.homeGoals} – {s.awayGoals}</Typography></TableCell>
                    <TableCell align="right" sx={{ pr: { xs: 1.5, sm: 2 } }}>
                      <Chip label={pct(s.probability)} size="small" sx={{
                        fontWeight: 600, fontFeatureSettings: "'tnum'", fontSize: '0.74rem', height: 24,
                        bgcolor: i === 0 ? chipColor : i < 3 ? chipAccentBg : (isDark ? 'rgba(255,255,255,0.05)' : '#f5f5f5'),
                        color: i === 0 ? '#fff' : i < 3 ? chipBg : (isDark ? '#8888a0' : '#666'),
                      }} />
                    </TableCell>
                  </TableRow>
                </Grow>
              ))}
            </TableBody>
          </Table>
        </TableContainer>
      );
    }

    function ModelProbBars({ title, subtitle, data, home, away, animProbs, isSimulating, isDark, colors, compact }) {
      return (
        <Box sx={{ flex: 1, minWidth: 0 }}>
          <Typography variant="subtitle2" sx={{ mb: 0.3, fontSize: compact ? '0.72rem' : '0.82rem' }}>{title}</Typography>
          {subtitle && <Typography variant="caption" sx={{ color: isDark ? '#555' : '#aaa', display: 'block', mb: 1, fontFeatureSettings: "'tnum'", fontSize: '0.7rem' }}>{subtitle}</Typography>}
          {!subtitle && <Box sx={{ mb: compact ? 0.8 : 1.2 }} />}
          <ProbBar label={`${home || 'Home'} win`} value={data.homeWin} animatedValue={isSimulating && animProbs ? animProbs.h : null} color={colors.homeWin} isDark={isDark} compact={compact} />
          <ProbBar label="Draw" value={data.draw} animatedValue={isSimulating && animProbs ? animProbs.d : null} color={colors.draw} isDark={isDark} compact={compact} />
          <ProbBar label={`${away || 'Away'} win`} value={data.awayWin} animatedValue={isSimulating && animProbs ? animProbs.a : null} color={colors.awayWin} isDark={isDark} compact={compact} />
        </Box>
      );
    }

    /* ── Match Predictor Page ──────────────────────────────── */
    function PredictorPage({ isDark, isMobile }) {
      const [home, setHome]       = React.useState(null);
      const [away, setAway]       = React.useState(null);
      const [phase, setPhase]     = React.useState('empty');
      const [simProgress, setSimProgress] = React.useState(0);
      const [mlAnimProbs, setMlAnimProbs]         = React.useState({ h: 0.333, d: 0.333, a: 0.333 });
      const [poissonAnimProbs, setPoissonAnimProbs] = React.useState({ h: 0.333, d: 0.333, a: 0.333 });
      const [revealedRows, setRevealedRows] = React.useState(0);
      const rafRef = React.useRef(null);

      React.useEffect(() => {
        if (home && away && phase === 'empty') setPhase('ready');
        if ((!home || !away) && phase === 'ready') setPhase('empty');
      }, [home, away]);

      const runSimulation = () => {
        setPhase('simulating'); setSimProgress(0); setRevealedRows(0);
        setMlAnimProbs({ h: 0.333, d: 0.333, a: 0.333 }); setPoissonAnimProbs({ h: 0.333, d: 0.333, a: 0.333 });
        const duration = 2600, start = performance.now(), ml = MOCK_RESPONSE.ml, po = MOCK_RESPONSE.poisson;
        const tick = (now) => {
          const t = Math.min((now - start) / duration, 1), ease = 1 - Math.pow(1 - t, 3);
          const jitter = (1 - ease) * (Math.random() - 0.5) * 0.08;
          setSimProgress(ease);
          setMlAnimProbs({ h: lerp(0.333, ml.homeWin, ease) + jitter, d: lerp(0.333, ml.draw, ease) - jitter * 0.5, a: lerp(0.333, ml.awayWin, ease) - jitter * 0.5 });
          setPoissonAnimProbs({ h: lerp(0.333, po.homeWin, ease) + jitter * 0.7, d: lerp(0.333, po.draw, ease) - jitter * 0.3, a: lerp(0.333, po.awayWin, ease) - jitter * 0.4 });
          setRevealedRows(Math.min(10, Math.floor(ease * 13)));
          if (t < 1) { rafRef.current = requestAnimationFrame(tick); }
          else { setMlAnimProbs({ h: ml.homeWin, d: ml.draw, a: ml.awayWin }); setPoissonAnimProbs({ h: po.homeWin, d: po.draw, a: po.awayWin }); setRevealedRows(10); setTimeout(() => setPhase('result'), 200); }
        };
        rafRef.current = requestAnimationFrame(tick);
      };
      React.useEffect(() => () => cancelAnimationFrame(rafRef.current), []);
      const reset = () => { setPhase(home && away ? 'ready' : 'empty'); setSimProgress(0); setRevealedRows(0); };

      const isSimulating = phase === 'simulating', showResult = phase === 'result' || isSimulating;
      const mlColors = { homeWin: isDark ? '#7C4DFF' : '#3D195B', draw: isDark ? '#546E7A' : '#78909C', awayWin: '#00E676' };
      const poissonColors = { homeWin: isDark ? '#FF6D00' : '#E65100', draw: isDark ? '#546E7A' : '#78909C', awayWin: isDark ? '#26C6DA' : '#00838F' };
      const vsColor = isDark ? '#555' : '#bbb', subColor = isDark ? '#6a6a80' : '#999';
      const gradBtn = isDark ? 'linear-gradient(135deg, #5B2D8E 0%, #7C4DFF 100%)' : 'linear-gradient(135deg, #3D195B 0%, #5B2D8E 100%)';
      const gradBtnHover = isDark ? 'linear-gradient(135deg, #4A2375 0%, #6A3DE0 100%)' : 'linear-gradient(135deg, #2E1245 0%, #4A2375 100%)';
      const progressTrack = isDark ? 'rgba(255,255,255,0.06)' : '#eee';
      const progressGrad = isDark ? 'linear-gradient(90deg, #7C4DFF 0%, #00FF87 100%)' : 'linear-gradient(90deg, #3D195B 0%, #00FF87 100%)';
      const dividerColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)';
      const mlChip = { color: isDark ? '#7C4DFF' : '#3D195B', accentBg: isDark ? 'rgba(124,77,255,0.15)' : '#ede7f6', accentText: isDark ? '#b09aff' : '#3D195B' };
      const poissonChip = { color: isDark ? '#FF6D00' : '#E65100', accentBg: isDark ? 'rgba(255,109,0,0.15)' : '#fff3e0', accentText: isDark ? '#ffab40' : '#E65100' };
      const cardPx = { xs: 2.5, sm: 4 }, cardPy = { xs: 2.5, sm: 4 };

      return (
        <Stack spacing={{ xs: 2, sm: 3 }}>
          <Paper sx={{ px: cardPx, py: cardPy }}>
            <Typography variant="h5" sx={{ mb: 0.3, fontSize: { xs: '1.25rem', sm: '1.5rem' } }}>Match Predictor</Typography>
            <Typography variant="subtitle2" sx={{ mb: { xs: 2, sm: 3 }, fontSize: { xs: '0.72rem', sm: '0.82rem' } }}>ML model + Poisson baseline</Typography>

            <Stack direction={{ xs: 'column', sm: 'row' }} spacing={1.5} sx={{ mb: { xs: 2, sm: 3 } }}>
              <TeamPicker label="Home team" value={home} onChange={setHome} exclude={away} />
              <TeamPicker label="Away team" value={away} onChange={setAway} exclude={home} />
            </Stack>

            {phase !== 'result' && (
              <Button variant="contained" fullWidth disabled={phase === 'empty' || isSimulating} onClick={runSimulation} disableElevation
                sx={{ py: { xs: 1.2, sm: 1.4 }, fontSize: { xs: '0.9rem', sm: '1rem' }, background: phase === 'empty' ? undefined : gradBtn, '&:hover': { background: gradBtnHover } }}>
                {isSimulating ? 'Simulating…' : 'Predict'}
              </Button>
            )}
            {phase === 'result' && <Button variant="outlined" fullWidth onClick={reset} sx={{ py: { xs: 1, sm: 1.2 } }}>New prediction</Button>}
          </Paper>

          {showResult && (
            <Fade in>
              <Paper sx={{ px: cardPx, py: cardPy }}>
                {isSimulating && (
                  <Box sx={{ mb: 2 }}>
                    <LinearProgress variant="determinate" value={simProgress * 100} sx={{ height: 6, borderRadius: 3, bgcolor: progressTrack, '& .MuiLinearProgress-bar': { borderRadius: 3, background: progressGrad } }} />
                    <SimCounter count={Math.round(simProgress * 10000)} total={10000} isDark={isDark} />
                  </Box>
                )}
                {phase === 'result' && (
                  <Box sx={{ textAlign: 'center', mb: { xs: 2, sm: 3 } }}>
                    <Typography variant="body2" sx={{ color: subColor, fontWeight: 500, mb: 0.3, fontSize: '0.75rem' }}>Prediction</Typography>
                    <Typography variant="h5" sx={{ fontSize: { xs: '1.05rem', sm: '1.35rem' }, lineHeight: 1.3 }}>
                      {home} <span style={{ color: vsColor, fontWeight: 400, margin: '0 4px' }}>vs</span> {away}
                    </Typography>
                  </Box>
                )}
                <Stack direction={{ xs: 'column', sm: 'row' }} spacing={{ xs: 0, sm: 0 }}
                  divider={isMobile ? <Divider sx={{ borderColor: dividerColor, my: 2 }} /> : <Divider orientation="vertical" flexItem sx={{ borderColor: dividerColor, mx: 2.5 }} />}>
                  <ModelProbBars title="ML Model" subtitle={null} data={MOCK_RESPONSE.ml} home={home} away={away} animProbs={isSimulating ? mlAnimProbs : null} isSimulating={isSimulating} isDark={isDark} colors={mlColors} compact={isMobile} />
                  <ModelProbBars title="Poisson Baseline" subtitle={phase === 'result' ? `λ home ${MOCK_RESPONSE.poisson.homeLambda.toFixed(2)}  ·  λ away ${MOCK_RESPONSE.poisson.awayLambda.toFixed(2)}` : null} data={MOCK_RESPONSE.poisson} home={home} away={away} animProbs={isSimulating ? poissonAnimProbs : null} isSimulating={isSimulating} isDark={isDark} colors={poissonColors} compact={isMobile} />
                </Stack>
              </Paper>
            </Fade>
          )}

          {showResult && (
            <Fade in timeout={400}>
              <div>
                <Stack direction={{ xs: 'column', sm: 'row' }} spacing={{ xs: 2, sm: 2.5 }}>
                  <Paper sx={{ px: cardPx, py: cardPy, flex: 1, minWidth: 0 }}>
                    <Typography variant="subtitle2" sx={{ mb: 1.5, fontSize: { xs: '0.72rem', sm: '0.78rem' } }}>ML Model scorelines</Typography>
                    <ScorelineTable scorelines={MOCK_RESPONSE.ml.scorelines} revealed={isSimulating ? revealedRows : null} isDark={isDark} chipColor={mlChip.color} chipBg={mlChip.accentText} chipAccentBg={mlChip.accentBg} />
                  </Paper>
                  <Paper sx={{ px: cardPx, py: cardPy, flex: 1, minWidth: 0 }}>
                    <Typography variant="subtitle2" sx={{ mb: 1.5, fontSize: { xs: '0.72rem', sm: '0.78rem' } }}>Poisson scorelines</Typography>
                    <ScorelineTable scorelines={MOCK_RESPONSE.poisson.scorelines} revealed={isSimulating ? revealedRows : null} isDark={isDark} chipColor={poissonChip.color} chipBg={poissonChip.accentText} chipAccentBg={poissonChip.accentBg} />
                  </Paper>
                </Stack>
              </div>
            </Fade>
          )}
        </Stack>
      );
    }

    /* ── Match Result Card ───────────────────────────────────── */
    function MatchResultCard({ match, isDark, isMobile }) {
      const m = match;
      const bothCorrect = m.ml.correct && m.poisson.correct;
      const bothWrong = !m.ml.correct && !m.poisson.correct;

      const borderColor = bothCorrect
        ? (isDark ? 'rgba(0,230,118,0.3)' : 'rgba(0,200,83,0.4)')
        : bothWrong
          ? (isDark ? 'rgba(255,82,82,0.25)' : 'rgba(255,82,82,0.3)')
          : (isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)');

      const bgTint = bothCorrect
        ? (isDark ? 'rgba(0,230,118,0.03)' : 'rgba(0,200,83,0.03)')
        : bothWrong
          ? (isDark ? 'rgba(255,82,82,0.03)' : 'rgba(255,82,82,0.02)')
          : 'transparent';

      const mlColors = { homeWin: isDark ? '#7C4DFF' : '#3D195B', draw: isDark ? '#546E7A' : '#78909C', awayWin: '#00E676' };
      const poissonColors = { homeWin: isDark ? '#FF6D00' : '#E65100', draw: isDark ? '#546E7A' : '#78909C', awayWin: isDark ? '#26C6DA' : '#00838F' };
      const vsColor = isDark ? '#555' : '#bbb';
      const dividerColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)';
      const correctColor = '#00E676';
      const wrongColor = isDark ? '#FF5252' : '#D32F2F';

      return (
        <Paper sx={{
          px: { xs: 2, sm: 3 },
          py: { xs: 2, sm: 2.5 },
          border: `1px solid ${borderColor}`,
          bgcolor: bgTint,
        }}>
          <Stack direction="row" justifyContent="space-between" alignItems="flex-start" sx={{ mb: 1 }}>
            <Box>
              <Typography variant="h6" sx={{ fontSize: { xs: '1rem', sm: '1.15rem' }, fontWeight: 700, lineHeight: 1.3 }}>
                {m.homeTeam} <Box component="span" sx={{ fontWeight: 700, fontFeatureSettings: "'tnum'" }}>{m.homeGoals}</Box>
                <Box component="span" sx={{ color: vsColor, fontWeight: 400, mx: 0.8, fontSize: '0.85em' }}>–</Box>
                <Box component="span" sx={{ fontWeight: 700, fontFeatureSettings: "'tnum'" }}>{m.awayGoals}</Box> {m.awayTeam}
              </Typography>
            </Box>
            <Stack direction="row" spacing={1} sx={{ flexShrink: 0, ml: 1.5 }}>
              <Chip
                label={`ML ${m.ml.correct ? '✓' : '✗'}`}
                size="small"
                sx={{
                  fontWeight: 700,
                  fontSize: '0.72rem',
                  height: 24,
                  bgcolor: m.ml.correct ? (isDark ? 'rgba(0,230,118,0.12)' : 'rgba(0,200,83,0.12)') : (isDark ? 'rgba(255,82,82,0.12)' : 'rgba(255,82,82,0.1)'),
                  color: m.ml.correct ? correctColor : wrongColor,
                  border: 'none',
                }}
              />
              <Chip
                label={`Poi ${m.poisson.correct ? '✓' : '✗'}`}
                size="small"
                sx={{
                  fontWeight: 700,
                  fontSize: '0.72rem',
                  height: 24,
                  bgcolor: m.poisson.correct ? (isDark ? 'rgba(0,230,118,0.12)' : 'rgba(0,200,83,0.12)') : (isDark ? 'rgba(255,82,82,0.12)' : 'rgba(255,82,82,0.1)'),
                  color: m.poisson.correct ? correctColor : wrongColor,
                  border: 'none',
                }}
              />
            </Stack>
          </Stack>

          <Stack direction="row" spacing={{ xs: 2, sm: 3 }} sx={{ mb: { xs: 1.5, sm: 2 } }}>
            <Box>
              <Typography variant="caption" sx={{ color: isDark ? '#6a6a80' : '#999', fontSize: '0.68rem', textTransform: 'uppercase', letterSpacing: '0.04em' }}>ML predicted</Typography>
              <Typography variant="body2" sx={{ fontWeight: 700, fontFeatureSettings: "'tnum'", fontSize: '0.88rem', color: isDark ? '#b09aff' : '#3D195B' }}>
                {m.ml.topScore.h}–{m.ml.topScore.a} <Box component="span" sx={{ fontWeight: 500, color: isDark ? '#6a6a80' : '#999', fontSize: '0.78rem' }}>{pct(m.ml.topScore.prob)}</Box>
              </Typography>
            </Box>
            <Box>
              <Typography variant="caption" sx={{ color: isDark ? '#6a6a80' : '#999', fontSize: '0.68rem', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Poisson predicted</Typography>
              <Typography variant="body2" sx={{ fontWeight: 700, fontFeatureSettings: "'tnum'", fontSize: '0.88rem', color: isDark ? '#ffab40' : '#E65100' }}>
                {m.poisson.topScore.h}–{m.poisson.topScore.a} <Box component="span" sx={{ fontWeight: 500, color: isDark ? '#6a6a80' : '#999', fontSize: '0.78rem' }}>{pct(m.poisson.topScore.prob)}</Box>
              </Typography>
            </Box>
          </Stack>

          <Stack
            direction={{ xs: 'column', sm: 'row' }}
            spacing={0}
            divider={isMobile
              ? <Divider sx={{ borderColor: dividerColor, my: 1.5 }} />
              : <Divider orientation="vertical" flexItem sx={{ borderColor: dividerColor, mx: 2 }} />
            }
          >
            <ModelProbBars
              title="ML Model"
              subtitle={null}
              data={m.ml}
              home={m.homeTeam}
              away={m.awayTeam}
              animProbs={null}
              isSimulating={false}
              isDark={isDark}
              colors={mlColors}
              compact={true}
            />
            <ModelProbBars
              title="Poisson Baseline"
              subtitle={null}
              data={m.poisson}
              home={m.homeTeam}
              away={m.awayTeam}
              animProbs={null}
              isSimulating={false}
              isDark={isDark}
              colors={poissonColors}
              compact={true}
            />
          </Stack>
        </Paper>
      );
    }

    /* ── Matchweek Review Page ─────────────────────────────── */
    function ResultsPage({ isDark, isMobile }) {
      const [weekIdx, setWeekIdx] = React.useState(1);
      const week = MOCK_MATCHWEEKS[weekIdx];
      const data = MOCK_MATCHWEEK_DATA;
      const s = data.summary;
      const cardPx = { xs: 2, sm: 4 }, cardPy = { xs: 2, sm: 3 };

      return (
        <Stack spacing={{ xs: 2, sm: 3 }}>
          <Paper sx={{ px: cardPx, py: cardPy }}>
            <Stack direction="row" alignItems="center" justifyContent="space-between">
              <IconButton onClick={() => setWeekIdx(Math.max(0, weekIdx - 1))} disabled={weekIdx === 0} size="small" sx={{ color: isDark ? '#8888a0' : '#666' }}>
                <ChevronLeft />
              </IconButton>
              <Box sx={{ textAlign: 'center' }}>
                <Typography variant="h5" sx={{ fontSize: { xs: '1.1rem', sm: '1.35rem' } }}>
                  Matchweek {week.week}
                </Typography>
                <Typography variant="body2" sx={{ color: isDark ? '#6a6a80' : '#999', fontSize: '0.8rem', mt: 0.3 }}>
                  {week.startDate} – {week.endDate} · {week.matchCount} matches
                </Typography>
              </Box>
              <IconButton onClick={() => setWeekIdx(Math.min(MOCK_MATCHWEEKS.length - 1, weekIdx + 1))} disabled={weekIdx === MOCK_MATCHWEEKS.length - 1} size="small" sx={{ color: isDark ? '#8888a0' : '#666' }}>
                <ChevronRight />
              </IconButton>
            </Stack>
          </Paper>

          <Paper sx={{ px: cardPx, py: { xs: 1.5, sm: 2 } }}>
            <Stack direction="row" spacing={{ xs: 2, sm: 4 }} justifyContent="center">
              <Box sx={{ textAlign: 'center' }}>
                <Typography variant="body2" sx={{ fontWeight: 700, color: isDark ? '#b09aff' : '#3D195B', fontSize: '1.1rem', fontFeatureSettings: "'tnum'" }}>
                  {s.mlCorrect}/{s.mlTotal}
                </Typography>
                <Typography variant="caption" sx={{ color: isDark ? '#6a6a80' : '#999', fontSize: '0.72rem', textTransform: 'uppercase', letterSpacing: '0.04em' }}>ML correct</Typography>
              </Box>
              <Divider orientation="vertical" flexItem sx={{ borderColor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)' }} />
              <Box sx={{ textAlign: 'center' }}>
                <Typography variant="body2" sx={{ fontWeight: 700, color: isDark ? '#ffab40' : '#E65100', fontSize: '1.1rem', fontFeatureSettings: "'tnum'" }}>
                  {s.poissonCorrect}/{s.poissonTotal}
                </Typography>
                <Typography variant="caption" sx={{ color: isDark ? '#6a6a80' : '#999', fontSize: '0.72rem', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Poisson correct</Typography>
              </Box>
            </Stack>
          </Paper>

          {data.matches.map((m, i) => (
            <MatchResultCard key={i} match={m} isDark={isDark} isMobile={isMobile} />
          ))}
        </Stack>
      );
    }

    /* ── Main App ──────────────────────────────────────────── */
    function App() {
      const [mode, setMode] = React.useState('dark');
      const [page, setPage] = React.useState('predictor');
      const isDark = mode === 'dark';
      const theme  = React.useMemo(() => makeTheme(mode), [mode]);
      const isMobile = useMediaQuery(theme.breakpoints.down('sm'));

      const toggleMode = () => {
        const next = isDark ? 'light' : 'dark';
        setMode(next);
        document.body.className = next;
      };

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <TopNav page={page} setPage={setPage} isDark={isDark} toggleMode={toggleMode} isMobile={isMobile} />
          <Box sx={{ display: 'flex', justifyContent: 'center', px: { xs: 1.5, sm: 3 }, py: { xs: 2, sm: 4 } }}>
            <Box sx={{ width: '100%', maxWidth: 900 }}>
              {page === 'predictor' && <PredictorPage isDark={isDark} isMobile={isMobile} />}
              {page === 'results'   && <ResultsPage isDark={isDark} isMobile={isMobile} />}
            </Box>
          </Box>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
