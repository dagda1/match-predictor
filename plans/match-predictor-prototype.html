<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Match Predictor — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
      transition: background-color 0.3s ease;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    @media (min-width: 600px) {
      body { padding: 48px 24px; }
    }
    body.light { background: #f5f5f7; }
    body.dark  { background: #0e0e12; }
    #root { width: 100%; max-width: 780px; }
    .MuiAutocomplete-popper { z-index: 1300 !important; }
    /* prevent iOS input zoom */
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="dark">
  <div id="root"></div>

  <script type="text/babel">
    const {
      ThemeProvider, createTheme, useMediaQuery,
      CssBaseline, Paper, Typography, Button, Box, Stack,
      Autocomplete, TextField, LinearProgress, Table, TableBody,
      TableCell, TableContainer, TableHead, TableRow, Chip,
      Fade, Grow, IconButton, Tooltip, Tabs, Tab, Divider
    } = MaterialUI;

    /* ── Themes ────────────────────────────────────────────── */
    const makeTheme = (mode) => createTheme({
      palette: {
        mode,
        primary:   { main: mode === 'dark' ? '#7C4DFF' : '#3D195B' },
        secondary: { main: '#00FF87' },
        background: mode === 'dark'
          ? { default: '#0e0e12', paper: '#1a1a24' }
          : { default: '#f5f5f7', paper: '#ffffff' },
        text: mode === 'dark'
          ? { primary: '#e8e8ed', secondary: '#8888a0' }
          : { primary: '#1a1a2e', secondary: '#666680' },
      },
      typography: {
        fontFamily: "'Roboto', sans-serif",
        h5: { fontWeight: 700, letterSpacing: '-0.02em' },
        subtitle2: {
          fontWeight: 500,
          fontSize: '0.82rem',
          letterSpacing: '0.04em',
          textTransform: 'uppercase',
          color: mode === 'dark' ? '#6a6a80' : '#888',
        },
      },
      shape: { borderRadius: 14 },
      components: {
        MuiButton: {
          styleOverrides: {
            root: { borderRadius: 12, textTransform: 'none', fontWeight: 600, fontSize: '0.95rem', padding: '10px 32px' },
          },
        },
        MuiPaper: {
          styleOverrides: {
            root: {
              borderRadius: 16,
              backgroundImage: 'none',
              boxShadow: mode === 'dark'
                ? '0 1px 3px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4)'
                : '0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06)',
              border: mode === 'dark' ? '1px solid rgba(255,255,255,0.06)' : 'none',
            },
          },
        },
        MuiOutlinedInput: {
          styleOverrides: {
            root: {
              ...(mode === 'dark' ? {
                '& .MuiOutlinedInput-notchedOutline': { borderColor: 'rgba(255,255,255,0.12)' },
                '&:hover .MuiOutlinedInput-notchedOutline': { borderColor: 'rgba(255,255,255,0.24)' },
              } : {}),
            },
          },
        },
        MuiTableCell: {
          styleOverrides: {
            root: {
              padding: '10px 12px',
              ...(mode === 'dark' ? { borderBottomColor: 'rgba(255,255,255,0.06)' } : {}),
            },
          },
        },
        MuiTab: {
          styleOverrides: {
            root: { textTransform: 'none', fontWeight: 600, fontSize: '0.85rem', minHeight: 42, minWidth: 0, px: 2 },
          },
        },
        MuiTabs: {
          styleOverrides: {
            root: { minHeight: 42 },
          },
        },
      },
    });

    /* ── Data ───────────────────────────────────────────────── */
    const TEAMS = [
      'Arsenal', 'Aston Villa', 'Bournemouth', 'Brentford', 'Brighton',
      'Burnley', 'Chelsea', 'Crystal Palace', 'Everton', 'Fulham',
      'Leeds United', 'Leicester City', 'Liverpool', 'Manchester City',
      'Manchester United', 'Newcastle United', 'Nottingham Forest',
      'Sunderland', 'Tottenham Hotspur', 'West Ham United',
    ];

    const MOCK_RESPONSE = {
      ml: {
        homeWin: 0.482,
        draw: 0.241,
        awayWin: 0.277,
        scorelines: [
          { homeGoals: 2, awayGoals: 1, probability: 0.142 },
          { homeGoals: 1, awayGoals: 0, probability: 0.128 },
          { homeGoals: 2, awayGoals: 0, probability: 0.112 },
          { homeGoals: 1, awayGoals: 1, probability: 0.098 },
          { homeGoals: 3, awayGoals: 1, probability: 0.074 },
          { homeGoals: 0, awayGoals: 0, probability: 0.068 },
          { homeGoals: 0, awayGoals: 1, probability: 0.062 },
          { homeGoals: 2, awayGoals: 2, probability: 0.054 },
          { homeGoals: 3, awayGoals: 2, probability: 0.041 },
          { homeGoals: 1, awayGoals: 2, probability: 0.038 },
        ],
      },
      poisson: {
        homeWin: 0.438,
        draw: 0.263,
        awayWin: 0.299,
        homeLambda: 1.72,
        awayLambda: 1.31,
        scorelines: [
          { homeGoals: 1, awayGoals: 1, probability: 0.134 },
          { homeGoals: 2, awayGoals: 1, probability: 0.115 },
          { homeGoals: 1, awayGoals: 0, probability: 0.102 },
          { homeGoals: 2, awayGoals: 0, probability: 0.088 },
          { homeGoals: 0, awayGoals: 1, probability: 0.078 },
          { homeGoals: 0, awayGoals: 0, probability: 0.076 },
          { homeGoals: 2, awayGoals: 2, probability: 0.075 },
          { homeGoals: 3, awayGoals: 1, probability: 0.066 },
          { homeGoals: 1, awayGoals: 2, probability: 0.059 },
          { homeGoals: 3, awayGoals: 2, probability: 0.043 },
        ],
      },
    };

    /* ── Helpers ────────────────────────────────────────────── */
    const pct  = (v) => `${(v * 100).toFixed(1)}%`;
    const lerp = (a, b, t) => a + (b - a) * t;
    const fmt  = (n) => n.toLocaleString();

    /* ── SVG Icons ─────────────────────────────────────────── */
    const SunIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    );
    const MoonIcon = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    );

    /* ── Components ────────────────────────────────────────── */

    function TeamPicker({ label, value, onChange, exclude }) {
      const options = TEAMS.filter((t) => t !== exclude);
      return (
        <Autocomplete
          value={value}
          onChange={(_, v) => onChange(v)}
          options={options}
          freeSolo={false}
          renderInput={(params) => (
            <TextField
              {...params}
              label={label}
              variant="outlined"
              InputLabelProps={{ ...params.InputLabelProps, style: { fontSize: 14 } }}
            />
          )}
          disableClearable={false}
          fullWidth
        />
      );
    }

    function ProbBar({ label, value, color, animatedValue, isDark, compact }) {
      const display = animatedValue != null ? animatedValue : value;
      const trackBg = isDark ? 'rgba(255,255,255,0.06)' : '#eee';
      const labelColor = isDark ? '#b0b0c0' : '#444';
      return (
        <Box sx={{ mb: compact ? 1 : 1.5 }}>
          <Stack direction="row" justifyContent="space-between" alignItems="center" sx={{ mb: 0.4 }}>
            <Typography
              variant="body2"
              noWrap
              sx={{ fontWeight: 500, color: labelColor, fontSize: compact ? '0.78rem' : '0.875rem', maxWidth: '60%' }}
            >
              {label}
            </Typography>
            <Typography variant="body2" sx={{ fontWeight: 700, fontFeatureSettings: "'tnum'", color, fontSize: compact ? '0.78rem' : '0.875rem' }}>
              {pct(display)}
            </Typography>
          </Stack>
          <Box sx={{ width: '100%', height: compact ? 8 : 10, borderRadius: 5, bgcolor: trackBg, overflow: 'hidden' }}>
            <Box sx={{
              width: `${display * 100}%`,
              height: '100%',
              borderRadius: 5,
              bgcolor: color,
              transition: animatedValue != null ? 'none' : 'width 0.6s ease',
            }} />
          </Box>
        </Box>
      );
    }

    function SimCounter({ count, total, isDark }) {
      return (
        <Typography variant="body2" sx={{ textAlign: 'center', color: isDark ? '#6a6a80' : '#888', fontFeatureSettings: "'tnum'", mt: 0.5, mb: 1.5, fontSize: '0.8rem' }}>
          {fmt(count)} / {fmt(total)} simulated
        </Typography>
      );
    }

    function ScorelineTable({ scorelines, revealed, isDark, chipColor, chipBg, chipAccentBg }) {
      const rows = revealed != null ? scorelines.slice(0, revealed) : scorelines;
      const headColor = isDark ? '#5a5a70' : '#999';
      return (
        <TableContainer sx={{ mx: { xs: -1, sm: 0 } }}>
          <Table size="small">
            <TableHead>
              <TableRow>
                <TableCell sx={{ fontWeight: 700, color: headColor, fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.06em', width: 28, pl: { xs: 1.5, sm: 2 } }}>#</TableCell>
                <TableCell sx={{ fontWeight: 700, color: headColor, fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.06em' }}>Score</TableCell>
                <TableCell align="right" sx={{ fontWeight: 700, color: headColor, fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.06em', pr: { xs: 1.5, sm: 2 } }}>Prob</TableCell>
              </TableRow>
            </TableHead>
            <TableBody>
              {rows.map((s, i) => (
                <Grow in key={i} timeout={300 + i * 80}>
                  <TableRow sx={{ '&:last-child td': { borderBottom: 0 } }}>
                    <TableCell sx={{ fontWeight: 500, color: isDark ? '#5a5a70' : '#aaa', width: 28, pl: { xs: 1.5, sm: 2 } }}>{i + 1}</TableCell>
                    <TableCell>
                      <Typography variant="body2" sx={{ fontWeight: 600, fontFeatureSettings: "'tnum'", fontSize: '0.85rem' }}>
                        {s.homeGoals} – {s.awayGoals}
                      </Typography>
                    </TableCell>
                    <TableCell align="right" sx={{ pr: { xs: 1.5, sm: 2 } }}>
                      <Chip
                        label={pct(s.probability)}
                        size="small"
                        sx={{
                          fontWeight: 600,
                          fontFeatureSettings: "'tnum'",
                          fontSize: '0.74rem',
                          height: 24,
                          bgcolor: i === 0 ? chipColor : i < 3 ? chipAccentBg : (isDark ? 'rgba(255,255,255,0.05)' : '#f5f5f5'),
                          color: i === 0 ? '#fff' : i < 3 ? chipBg : (isDark ? '#8888a0' : '#666'),
                        }}
                      />
                    </TableCell>
                  </TableRow>
                </Grow>
              ))}
            </TableBody>
          </Table>
        </TableContainer>
      );
    }

    /* Model probability section — reusable for ML and Poisson */
    function ModelProbBars({ title, subtitle, data, home, away, animProbs, isSimulating, isDark, colors, compact }) {
      return (
        <Box sx={{ flex: 1, minWidth: 0 }}>
          <Typography variant="subtitle2" sx={{ mb: 0.3, fontSize: compact ? '0.72rem' : '0.82rem' }}>{title}</Typography>
          {subtitle && (
            <Typography variant="caption" sx={{ color: isDark ? '#555' : '#aaa', display: 'block', mb: 1, fontFeatureSettings: "'tnum'", fontSize: '0.7rem' }}>
              {subtitle}
            </Typography>
          )}
          {!subtitle && <Box sx={{ mb: compact ? 0.8 : 1.2 }} />}
          <ProbBar
            label={`${home || 'Home'} win`}
            value={data.homeWin}
            animatedValue={isSimulating && animProbs ? animProbs.h : null}
            color={colors.homeWin}
            isDark={isDark}
            compact={compact}
          />
          <ProbBar
            label="Draw"
            value={data.draw}
            animatedValue={isSimulating && animProbs ? animProbs.d : null}
            color={colors.draw}
            isDark={isDark}
            compact={compact}
          />
          <ProbBar
            label={`${away || 'Away'} win`}
            value={data.awayWin}
            animatedValue={isSimulating && animProbs ? animProbs.a : null}
            color={colors.awayWin}
            isDark={isDark}
            compact={compact}
          />
        </Box>
      );
    }

    /* ── Main App ──────────────────────────────────────────── */
    function App() {
      const [mode, setMode]       = React.useState('dark');
      const [home, setHome]       = React.useState(null);
      const [away, setAway]       = React.useState(null);
      const [phase, setPhase]     = React.useState('empty');
      const [simProgress, setSimProgress] = React.useState(0);
      const [mlAnimProbs, setMlAnimProbs]         = React.useState({ h: 0.333, d: 0.333, a: 0.333 });
      const [poissonAnimProbs, setPoissonAnimProbs] = React.useState({ h: 0.333, d: 0.333, a: 0.333 });
      const [revealedRows, setRevealedRows] = React.useState(0);
      const [scoreTab, setScoreTab] = React.useState(0);
      const rafRef = React.useRef(null);

      const isDark = mode === 'dark';
      const theme  = React.useMemo(() => makeTheme(mode), [mode]);
      const isMobile = useMediaQuery(theme.breakpoints.down('sm'));

      const toggleMode = () => {
        const next = isDark ? 'light' : 'dark';
        setMode(next);
        document.body.className = next;
      };

      React.useEffect(() => {
        if (home && away && phase === 'empty') setPhase('ready');
        if ((!home || !away) && phase === 'ready') setPhase('empty');
      }, [home, away]);

      const runSimulation = () => {
        setPhase('simulating');
        setSimProgress(0);
        setRevealedRows(0);
        setScoreTab(0);
        setMlAnimProbs({ h: 0.333, d: 0.333, a: 0.333 });
        setPoissonAnimProbs({ h: 0.333, d: 0.333, a: 0.333 });

        const duration = 2600;
        const start = performance.now();
        const ml = MOCK_RESPONSE.ml;
        const po = MOCK_RESPONSE.poisson;

        const tick = (now) => {
          const elapsed = now - start;
          const t = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          const jitter = (1 - ease) * (Math.random() - 0.5) * 0.08;

          setSimProgress(ease);
          setMlAnimProbs({
            h: lerp(0.333, ml.homeWin, ease) + jitter,
            d: lerp(0.333, ml.draw,    ease) - jitter * 0.5,
            a: lerp(0.333, ml.awayWin, ease) - jitter * 0.5,
          });
          setPoissonAnimProbs({
            h: lerp(0.333, po.homeWin, ease) + jitter * 0.7,
            d: lerp(0.333, po.draw,    ease) - jitter * 0.3,
            a: lerp(0.333, po.awayWin, ease) - jitter * 0.4,
          });
          setRevealedRows(Math.min(10, Math.floor(ease * 13)));

          if (t < 1) {
            rafRef.current = requestAnimationFrame(tick);
          } else {
            setMlAnimProbs({ h: ml.homeWin, d: ml.draw, a: ml.awayWin });
            setPoissonAnimProbs({ h: po.homeWin, d: po.draw, a: po.awayWin });
            setRevealedRows(10);
            setTimeout(() => setPhase('result'), 200);
          }
        };

        rafRef.current = requestAnimationFrame(tick);
      };

      React.useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

      const reset = () => {
        setPhase(home && away ? 'ready' : 'empty');
        setSimProgress(0);
        setRevealedRows(0);
      };

      const isSimulating = phase === 'simulating';
      const showResult   = phase === 'result' || isSimulating;

      /* colour tokens */
      const mlColors = {
        homeWin: isDark ? '#7C4DFF' : '#3D195B',
        draw:    isDark ? '#546E7A' : '#78909C',
        awayWin: '#00E676',
      };
      const poissonColors = {
        homeWin: isDark ? '#FF6D00' : '#E65100',
        draw:    isDark ? '#546E7A' : '#78909C',
        awayWin: isDark ? '#26C6DA' : '#00838F',
      };
      const vsColor      = isDark ? '#555' : '#bbb';
      const subColor     = isDark ? '#6a6a80' : '#999';
      const gradBtn      = isDark
        ? 'linear-gradient(135deg, #5B2D8E 0%, #7C4DFF 100%)'
        : 'linear-gradient(135deg, #3D195B 0%, #5B2D8E 100%)';
      const gradBtnHover = isDark
        ? 'linear-gradient(135deg, #4A2375 0%, #6A3DE0 100%)'
        : 'linear-gradient(135deg, #2E1245 0%, #4A2375 100%)';
      const progressTrack = isDark ? 'rgba(255,255,255,0.06)' : '#eee';
      const progressGrad  = isDark
        ? 'linear-gradient(90deg, #7C4DFF 0%, #00FF87 100%)'
        : 'linear-gradient(90deg, #3D195B 0%, #00FF87 100%)';
      const dividerColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)';

      const mlChip = {
        color: isDark ? '#7C4DFF' : '#3D195B',
        accentBg: isDark ? 'rgba(124,77,255,0.15)' : '#ede7f6',
        accentText: isDark ? '#b09aff' : '#3D195B',
      };
      const poissonChip = {
        color: isDark ? '#FF6D00' : '#E65100',
        accentBg: isDark ? 'rgba(255,109,0,0.15)' : '#fff3e0',
        accentText: isDark ? '#ffab40' : '#E65100',
      };

      const cardPx = { xs: 2.5, sm: 4 };
      const cardPy = { xs: 2.5, sm: 4 };

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <Stack spacing={{ xs: 2, sm: 3 }}>
            {/* ── Header card ───────────────────────── */}
            <Paper sx={{ px: cardPx, py: cardPy }}>
              <Stack direction="row" justifyContent="space-between" alignItems="flex-start">
                <Box sx={{ minWidth: 0 }}>
                  <Typography variant="h5" noWrap sx={{ mb: 0.3, fontSize: { xs: '1.25rem', sm: '1.5rem' } }}>
                    Match Predictor
                  </Typography>
                  <Typography variant="subtitle2" sx={{ mb: { xs: 2, sm: 3 }, fontSize: { xs: '0.72rem', sm: '0.82rem' } }}>
                    ML model + Poisson baseline
                  </Typography>
                </Box>
                <Tooltip title={isDark ? 'Light mode' : 'Dark mode'}>
                  <IconButton onClick={toggleMode} size={isMobile ? 'small' : 'medium'} sx={{ color: isDark ? '#aaa' : '#666', mt: -0.5, ml: 1, flexShrink: 0 }}>
                    {isDark ? <SunIcon /> : <MoonIcon />}
                  </IconButton>
                </Tooltip>
              </Stack>

              <Stack direction="column" spacing={1.5} sx={{ mb: { xs: 2, sm: 3 } }}>
                <TeamPicker label="Home team" value={home} onChange={setHome} exclude={away} />
                <TeamPicker label="Away team" value={away} onChange={setAway} exclude={home} />
              </Stack>

              {phase !== 'result' && (
                <Button
                  variant="contained"
                  fullWidth
                  disabled={phase === 'empty' || isSimulating}
                  onClick={runSimulation}
                  disableElevation
                  sx={{
                    py: { xs: 1.2, sm: 1.4 },
                    fontSize: { xs: '0.9rem', sm: '1rem' },
                    background: phase === 'empty' ? undefined : gradBtn,
                    '&:hover': { background: gradBtnHover },
                  }}
                >
                  {isSimulating ? 'Simulating…' : 'Predict'}
                </Button>
              )}

              {phase === 'result' && (
                <Button variant="outlined" fullWidth onClick={reset} sx={{ py: { xs: 1, sm: 1.2 } }}>
                  New prediction
                </Button>
              )}
            </Paper>

            {/* ── Probabilities: ML vs Poisson ──────── */}
            {showResult && (
              <Fade in>
                <Paper sx={{ px: cardPx, py: cardPy }}>
                  {isSimulating && (
                    <Box sx={{ mb: 2 }}>
                      <LinearProgress
                        variant="determinate"
                        value={simProgress * 100}
                        sx={{
                          height: 6,
                          borderRadius: 3,
                          bgcolor: progressTrack,
                          '& .MuiLinearProgress-bar': { borderRadius: 3, background: progressGrad },
                        }}
                      />
                      <SimCounter count={Math.round(simProgress * 10000)} total={10000} isDark={isDark} />
                    </Box>
                  )}

                  {phase === 'result' && (
                    <Box sx={{ textAlign: 'center', mb: { xs: 2, sm: 3 } }}>
                      <Typography variant="body2" sx={{ color: subColor, fontWeight: 500, mb: 0.3, fontSize: '0.75rem' }}>Prediction</Typography>
                      <Typography variant="h5" sx={{ fontSize: { xs: '1.05rem', sm: '1.35rem' }, lineHeight: 1.3 }}>
                        {home} <span style={{ color: vsColor, fontWeight: 400, margin: '0 4px' }}>vs</span> {away}
                      </Typography>
                    </Box>
                  )}

                  {/* On mobile: stack vertically with horizontal divider. Desktop: side by side with vertical divider */}
                  <Stack
                    direction={{ xs: 'column', sm: 'row' }}
                    spacing={{ xs: 0, sm: 0 }}
                    divider={
                      isMobile
                        ? <Divider sx={{ borderColor: dividerColor, my: 2 }} />
                        : <Divider orientation="vertical" flexItem sx={{ borderColor: dividerColor, mx: 2.5 }} />
                    }
                  >
                    <ModelProbBars
                      title="ML Model"
                      subtitle={null}
                      data={MOCK_RESPONSE.ml}
                      home={home} away={away}
                      animProbs={isSimulating ? mlAnimProbs : null}
                      isSimulating={isSimulating}
                      isDark={isDark}
                      colors={mlColors}
                      compact={isMobile}
                    />
                    <ModelProbBars
                      title="Poisson Baseline"
                      subtitle={phase === 'result' ? `λ home ${MOCK_RESPONSE.poisson.homeLambda.toFixed(2)}  ·  λ away ${MOCK_RESPONSE.poisson.awayLambda.toFixed(2)}` : null}
                      data={MOCK_RESPONSE.poisson}
                      home={home} away={away}
                      animProbs={isSimulating ? poissonAnimProbs : null}
                      isSimulating={isSimulating}
                      isDark={isDark}
                      colors={poissonColors}
                      compact={isMobile}
                    />
                  </Stack>
                </Paper>
              </Fade>
            )}

            {/* ── Scorelines: tabbed ML / Poisson ────── */}
            {showResult && (
              <Fade in timeout={400}>
                <Paper sx={{ px: cardPx, py: cardPy }}>
                  <Typography variant="subtitle2" sx={{ mb: 1, fontSize: { xs: '0.72rem', sm: '0.82rem' } }}>
                    Most likely scorelines
                  </Typography>

                  <Tabs
                    value={scoreTab}
                    onChange={(_, v) => setScoreTab(v)}
                    variant={isMobile ? 'fullWidth' : 'standard'}
                    sx={{
                      mb: 1.5,
                      '& .MuiTabs-indicator': {
                        backgroundColor: scoreTab === 0
                          ? (isDark ? '#7C4DFF' : '#3D195B')
                          : (isDark ? '#FF6D00' : '#E65100'),
                      },
                    }}
                  >
                    <Tab label="ML Model" sx={{
                      color: isDark ? '#8888a0' : '#888',
                      fontSize: { xs: '0.8rem', sm: '0.85rem' },
                      '&.Mui-selected': { color: isDark ? '#b09aff' : '#3D195B' },
                    }} />
                    <Tab label="Poisson" sx={{
                      color: isDark ? '#8888a0' : '#888',
                      fontSize: { xs: '0.8rem', sm: '0.85rem' },
                      '&.Mui-selected': { color: isDark ? '#ffab40' : '#E65100' },
                    }} />
                  </Tabs>

                  {scoreTab === 0 && (
                    <ScorelineTable
                      scorelines={MOCK_RESPONSE.ml.scorelines}
                      revealed={isSimulating ? revealedRows : null}
                      isDark={isDark}
                      chipColor={mlChip.color}
                      chipBg={mlChip.accentText}
                      chipAccentBg={mlChip.accentBg}
                    />
                  )}
                  {scoreTab === 1 && (
                    <ScorelineTable
                      scorelines={MOCK_RESPONSE.poisson.scorelines}
                      revealed={isSimulating ? revealedRows : null}
                      isDark={isDark}
                      chipColor={poissonChip.color}
                      chipBg={poissonChip.accentText}
                      chipAccentBg={poissonChip.accentBg}
                    />
                  )}
                </Paper>
              </Fade>
            )}
          </Stack>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
